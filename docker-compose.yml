# Example; on Unraid the container is managed by its template instead.
services:
  tvspy:
    image: ghcr.io/sawka-tech/tvspy:latest
    container_name: tvspy
    restart: unless-stopped
    ports:
      - 8183:80
    volumes:
      # Holds tvspy.db, backups and caches (and an old database.db, which is imported read-only).
      - ./data:/app/backend/src/database/file
    environment:
      - TZ=Europe/Warsaw
